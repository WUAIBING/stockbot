name: Sync DO Repo

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview sync without changing /opt/stockbot.
        required: true
        default: false
        type: boolean
      deploy_now:
        description: Emergency only - deploy during a trading session instead of waiting for 15:05 China.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stockbot-sync-do-repo
  cancel-in-progress: false

jobs:
  sync-do-repo:
    runs-on:
      - self-hosted
      - linux
      - stockbot-do
    # A push at 09:00 China on a trading day waits until 15:05 before syncing:
    # up to ~365 minutes, plus the sync itself.
    timeout-minutes: 400
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify checkout provenance
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/scripts/github-actions/verify_checkout_provenance.sh" \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_SHA" \
            "${{ github.ref_name }}"

      # Merging to master deploys. Never into a running trading day: on a
      # trading day the push waits until 15:05 China time, then syncs. Pushes
      # queue behind each other (concurrency above), so the newest master is
      # the last one deployed. Manual dry runs and an explicit deploy_now skip
      # the wait; the push trigger never does.
      - name: Wait for the market to close
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.deploy_now != 'true' }}
        shell: bash
        run: |
          WAIT=$(python3 "$GITHUB_WORKSPACE/scripts/github-actions/deploy_window.py" "$GITHUB_WORKSPACE/workbuddy/skills/a-share-analyst")
          if [ "${WAIT:-0}" -gt 0 ]; then
            echo "Trading session in progress - deploying at 15:05 China, in ${WAIT}s."
            sleep "$WAIT"
          fi

      - name: Sync checkout to /opt/stockbot
        shell: bash
        env:
          SYNC_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          SYNC_SOURCE_SHA: ${{ github.sha }}
          SYNC_SOURCE_BRANCH: ${{ github.ref_name }}
          SYNC_SOURCE_REMOTE_URL: https://github.com/${{ github.repository }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/github-actions/sync_repo_to_do.sh" "$GITHUB_WORKSPACE" /opt/stockbot

      - name: Show synced revision
        shell: bash
        run: |
          echo "GitHub SHA: $GITHUB_SHA"
          if [ -f /opt/stockbot/.stockbot-sync-source-sha ]; then
            echo "Recorded synced SHA: $(cat /opt/stockbot/.stockbot-sync-source-sha)"
          fi
          echo "Synced docs:"
          ls -la /opt/stockbot/docs | head -n 20
